# Адаптировано из официального
# https://github.com/twentyhq/twenty/blob/main/packages/twenty-docker/docker-compose.yml
# с добавлением Traefik labels для crm.13-33.pro и убранным публичным портом 3000.

services:
  twenty-server:
    image: twentycrm/twenty:latest
    container_name: twenty-server
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      SERVER_URL: https://crm.${DOMAIN}
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    networks:
      - proxy
      - twenty_internal
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.twenty.rule=Host(`crm.${DOMAIN}`)
      - traefik.http.routers.twenty.entrypoints=websecure
      - traefik.http.routers.twenty.tls.certresolver=letsencrypt
      - traefik.http.routers.twenty.middlewares=secure-headers@docker
      - traefik.http.services.twenty.loadbalancer.server.port=3000

  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: twenty-worker
    restart: unless-stopped
    depends_on:
      twenty-server:
        condition: service_healthy
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      SERVER_URL: https://crm.${DOMAIN}
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"           # сервер уже накатил
      DISABLE_CRON_JOBS_REGISTRATION: "true"  # сервер уже зарегистрировал
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    networks:
      - twenty_internal

  twenty-db:
    image: postgres:16
    container_name: twenty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD}
      POSTGRES_DB: default
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    networks:
      - twenty_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-redis:
    image: redis
    container_name: twenty-redis
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    networks:
      - twenty_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  twenty_db_data:
  twenty_server_data:

networks:
  proxy:
    external: true
  twenty_internal:
