# LiteLLM роутинг моделей.
# Документация: https://docs.litellm.ai/docs/proxy/configs
#
# 13-33 использует:
#   cheap     — для рутины (классификация Direction/Topic, парсинг, summary голосовых)
#   creative  — для генерации длинных текстов (Sonnet 4.7), под brand-13-33 voice
#   ollama/*  — локальные модели как fallback или для совсем мелких задач

model_list:
  # --- Cheap: дёшево, быстро, для технических задач ---
  - model_name: cheap
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Creative: для контента 13-33 ---
  - model_name: creative
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Локальные через Ollama (fallback / без денег) ---
  - model_name: ollama/qwen
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

  - model_name: ollama/qwen-tiny
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434

  # --- Anthropic напрямую по имени модели (если producer хочет Claude явно) ---
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
