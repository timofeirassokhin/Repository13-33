[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderland_bot"
version = "0.1.0"
description = "Tenderland API CLI: pull tender lists + download docs to Z:/tenders"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.2",
    "openpyxl==3.1.5",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "typer>=0.15.1,<0.18",
    "rich==13.9.4",
    "python-slugify==8.0.4",
]

[project.scripts]
tenderland = "tenderland_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
