# Payload CMS — внутренняя система, наружу не публикуется.
# Доступ: только из сети Tailscale — http://100.82.2.78:3010/admin (tailscale serve --tcp 3010 → 127.0.0.1:3010).
# База — в общем Postgres (роль/база payload), медиа — в общем MinIO (бакет payload).
# Код: apps/cms (шаблон payload with-postgres, тег v3.82.1), образ собирается из apps/cms/Dockerfile.
services:
  payload-cms:
    build: ../../apps/cms
    image: payload-cms:local
    container_name: payload-cms
    restart: unless-stopped
    env_file:
      - /opt/stack/secrets/payload.env
    ports:
      - "127.0.0.1:3010:3000"
    networks: [data]
    mem_limit: 768m

networks:
  data:
    external: true
