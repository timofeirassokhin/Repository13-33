services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      # TODO: дополнить env-переменными по доке OpenClaw, если нужны
      OPENCLAW_LOG_LEVEL: info
    volumes:
      - openclaw_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.openclaw.rule=Host(`claw.${DOMAIN}`)
      - traefik.http.routers.openclaw.entrypoints=websecure
      - traefik.http.routers.openclaw.tls.certresolver=letsencrypt
      - traefik.http.routers.openclaw.middlewares=secure-headers@docker
      - traefik.http.services.openclaw.loadbalancer.server.port=18789

volumes:
  openclaw_data:

networks:
  proxy:
    external: true
