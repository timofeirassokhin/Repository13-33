services:
  webdav:
    # Простой WebDAV-сервер на nginx+dav. Multi-user через htpasswd-файл.
    image: dgraziotin/nginx-webdav-nononsense:latest
    container_name: webdav
    restart: unless-stopped
    environment:
      # Базовая авторизация — username/password из .env (генерируется generate-secrets.sh)
      WEBDAV_USERNAME: ${WEBDAV_USERNAME}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD}
      # Доп пользователей — монтируй свой htpasswd в /etc/nginx/.htpasswd
      SERVER_NAMES_HASH_BUCKET_SIZE: 128
      CLIENT_MAX_BODY_SIZE: 4G  # книги/PDF могут быть тяжёлые
    volumes:
      - mempalace_uploads:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webdav.rule=Host(`drive.13-33.pro`)"
      - "traefik.http.routers.webdav.entrypoints=websecure"
      - "traefik.http.routers.webdav.tls.certresolver=letsencrypt"
      - "traefik.http.services.webdav.loadbalancer.server.port=80"
      # Headers для совместимости с Windows WebDAV клиентом
      - "traefik.http.middlewares.webdav-headers.headers.customRequestHeaders.Translate=f"
      - "traefik.http.routers.webdav.middlewares=webdav-headers"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 0"]  # WebDAV root возвращает 401 — это норма
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  mempalace_uploads:
    name: mempalace_uploads

networks:
  proxy:
    external: true
