[project]
name = "catalog-crawler"
version = "0.1.0"
description = "Gluvex catalog crawler — parses product catalogs from gluvexlab.com, genohub.com, vendor sites"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "lxml>=5.0",
  "asyncpg>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.4",
  "minio>=7.2",
  "tenacity>=8.2",
  "structlog>=24.1",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
