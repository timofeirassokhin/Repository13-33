user root;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # Traefik v3.5 шлёт устаревший /v1.24/... — перепишем на /v1.45/
        # (daemon 29.x минимум 1.40)
        location ~ ^/v[0-9.]+/(.*)$ {
            rewrite ^/v[0-9.]+/(.*)$ /v1.45/$1 break;
            proxy_pass http://docker;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 7200s;
        }

        # Не-версионированные запросы — как есть
        location / {
            proxy_pass http://docker;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 7200s;
        }
    }
}
