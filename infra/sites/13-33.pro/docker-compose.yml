services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: site-13-33-pro:local
    container_name: site-13-33-pro
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.site-13-33.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.site-13-33.entrypoints=websecure
      - traefik.http.routers.site-13-33.tls.certresolver=letsencrypt
      - traefik.http.routers.site-13-33.middlewares=secure-headers@docker
      - traefik.http.services.site-13-33.loadbalancer.server.port=80

networks:
  proxy:
    external: true
