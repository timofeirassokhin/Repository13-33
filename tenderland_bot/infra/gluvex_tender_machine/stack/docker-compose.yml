# Gluvex Tender Machine — Phase 3 stack
#
# Поднимает:
#   - caddy           → reverse proxy + auto Let's Encrypt
#   - twenty-server   → CRM (https://crm.${DOMAIN})
#   - twenty-worker   → background jobs Twenty
#   - twenty-db       → Postgres 16 для Twenty
#   - twenty-redis    → Redis 7 для Twenty (BullMQ очереди)
#   - litellm         → роутер моделей (https://litellm.${DOMAIN})
#
# Запуск:
#   cd /opt/gluvex/repos/Repository13-33/tenderland_bot/infra/gluvex_tender_machine/stack
#   ln -sf /opt/gluvex/secrets/.env .env
#   docker compose pull
#   docker compose up -d
#
# Что НЕ входит в этот стек (поднимем позже):
#   - mempalace, tender-pipeline (FastAPI+ARQ), whisper, ollama
#   - всё это добавится поверх через docker-compose.override.yml

name: gluvex

services:
  # ============================================================
  # Caddy — reverse proxy с авто-SSL
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    healthcheck:
      # caddy:2-alpine не имеет wget/curl, поэтому используем встроенный nc
      test: ["CMD-SHELL", "nc -z localhost 2019 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # Twenty CRM — https://crm.${DOMAIN}
  # ============================================================
  twenty-server:
    image: twentycrm/twenty:latest
    container_name: twenty-server
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      SERVER_URL: https://crm.${DOMAIN}
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    networks:
      - proxy
      - twenty_internal
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: twenty-worker
    restart: unless-stopped
    depends_on:
      twenty-server:
        condition: service_healthy
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      SERVER_URL: https://crm.${DOMAIN}
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    networks:
      - twenty_internal

  twenty-db:
    image: postgres:16
    container_name: twenty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD}
      POSTGRES_DB: default
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    networks:
      - twenty_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - twenty_redis_data:/data
    networks:
      - twenty_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # LiteLLM — https://litellm.${DOMAIN}
  # ============================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ============================================================
# Networks
# ============================================================
networks:
  proxy:
    name: gluvex_proxy
    driver: bridge
  twenty_internal:
    name: gluvex_twenty_internal
    driver: bridge
    internal: false  # нужен outbound (twenty подтягивает npm-пакеты)

# ============================================================
# Volumes
# ============================================================
volumes:
  caddy_data:
  caddy_config:
  twenty_db_data:
  twenty_redis_data:
  twenty_server_data:
