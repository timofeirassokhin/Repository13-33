# LiteLLM роутинг моделей.
# Документация: https://docs.litellm.ai/docs/proxy/configs
#
# 13-33 использует:
#   cheap     — OpenRouter Haiku (через OR — обходит RU-блок Anthropic)
#   creative  — OpenRouter Sonnet 4.5 (главная модель для брендового контента)
#   ollama/*  — локальные модели для рутины (классификация, dedup, summary)

model_list:
  # --- Cheap: дёшево, быстро, для технических задач ---
  - model_name: cheap
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # --- Creative: длинный осмысленный контент 13-33 ---
  - model_name: creative
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # --- Прямые алиасы Anthropic-моделей через OpenRouter ---
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: claude-haiku-4.5
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # --- Локальные через Ollama (бесплатно, без сети) ---
  - model_name: ollama/qwen
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434

  - model_name: ollama/qwen-tiny
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434

  - model_name: ollama/llama
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

  # --- Раскомментируй после `ollama pull gemma2:9b` ---
  # - model_name: ollama/gemma
  #   litellm_params:
  #     model: ollama/gemma2:9b
  #     api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
