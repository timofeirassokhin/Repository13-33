services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-with-socks:local
    container_name: litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # OpenRouter — основной провайдер (обходит RU-блок Anthropic, единый ключ для всех моделей)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Anthropic ключ оставляем на случай, если в будущем найдём способ напрямую
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    # Внутренний сервис — другие контейнеры обращаются на http://litellm:4000

networks:
  proxy:
    external: true
