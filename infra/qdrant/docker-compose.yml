services:
  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - proxy
    # Внутренний сервис — без Traefik labels, доступен другим контейнерам
    # на proxy network как http://qdrant:6333

volumes:
  qdrant_data:

networks:
  proxy:
    external: true
