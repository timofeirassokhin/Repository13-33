services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: site-timofeirassokhin-com:local
    container_name: site-timofeirassokhin-com
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.site-tr.rule=Host(`${TR_DOMAIN}`) || Host(`www.${TR_DOMAIN}`)
      - traefik.http.routers.site-tr.entrypoints=websecure
      - traefik.http.routers.site-tr.tls.certresolver=letsencrypt
      - traefik.http.routers.site-tr.middlewares=secure-headers@docker,www-redirect@docker
      - traefik.http.services.site-tr.loadbalancer.server.port=80
      # Редирект www.* → apex
      - traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\.(.+)$$
      - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$$1
      - traefik.http.middlewares.www-redirect.redirectregex.permanent=true

networks:
  proxy:
    external: true
