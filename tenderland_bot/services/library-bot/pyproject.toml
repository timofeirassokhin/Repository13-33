[project]
name = "library-bot"
version = "0.1.0"
description = "@gluvexlibrary_bot — Telegram-каталог приборов и брошюр Gluvex"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4.0",
  "aiohttp[speedups]>=3.10",
  "asyncpg>=0.29",
  "minio>=7.2",
  "httpx[socks]>=0.27",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
