[project]
name = "gluvex-catalog-mcp"
version = "0.1.0"
description = "MCP server exposing Gluvex catalog + RAG retrieval tools for sales/tender agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
gluvex-catalog-mcp = "gluvex_catalog_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluvex_catalog_mcp"]
